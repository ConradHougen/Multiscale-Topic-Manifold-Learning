[tool:pytest]
testpaths = legacy/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=legacy
    --cov-report=html:legacy/tests/htmlcov
    --cov-report=term-missing
    --cov-report=xml:legacy/tests/coverage.xml
    -v
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
