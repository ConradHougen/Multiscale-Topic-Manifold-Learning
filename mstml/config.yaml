# MSTML Default Configuration
# ===========================
# Only keys that are consumed by the pipeline are listed here.
# Sections for unimplemented features (BERTopic, link prediction, etc.) have
# been removed; they will be added back when those features are implemented.

# Temporal Analysis Configuration
temporal:
  gamma_temporal_decay: 0.75
  months_per_chunk: 6        # Fallback when not passed to create_temporal_chunks()
  save_statistics: true
  create_plot: true
  save_plot: true

# Topic Model Configuration
topic_model:
  type: LDA                  # Only 'LDA' is currently implemented
  docs_per_topic: 100        # Target docs per topic for automatic num_topics calculation
  params:
    lda:
      alpha: symmetric
      eta: symmetric
      npasses: 5
      ngibbs: 50
      num_topics: auto       # 'auto' computes from docs_per_topic; or set an integer
      random_state: 42

# Distance Metric Configuration
# Supported: hellinger | cosine | euclidean
distance_metric:
  type: hellinger

# Topic Embedding Configuration
# Supported: PHATE | UMAP | TSNE | PCA
# params.<type_lower> is forwarded as **kwargs to the corresponding class.
topic_embedding:
  type: PHATE
  params:
    phate:
      n_components: 2
      knn: 5
      decay: 40
      gamma: 1.0
      t: auto
      random_state: 42
    # umap:
    #   n_components: 2
    #   n_neighbors: 15
    #   random_state: 42
    # tsne:
    #   n_components: 2
    #   perplexity: 30.0
    #   random_state: 42
    # pca:
    #   n_components: 2
    #   random_state: 42

# Author and Document Distribution Diffusion
author_doc_embeddings:
  ct_distn_diffusion_knnk: 5    # k-NN used for the topic diffusion graph
  num_diffusion_iterations: 1   # Message-passing iterations over the topic graph
  diffusion_rate: 0.7           # Neighbour influence strength per iteration [0, 1]

# Mesoscale Topic Manifold Configuration
mesoscale_filtering:
  knnk_for_tpc_dendro: 100     # k used in FAISS search for topic dendrogram construction

# Hierarchical Clustering Configuration
clustering:
  linkage_method: ward          # 'ward', 'complete', 'average', 'single'

# Co-author Network Configuration
coauthor_network:
  min_collaborations: 1
  temporal: false
  degree_limits: null           # [min_degree, max_degree] or null

# Analysis Configuration
analysis:
  term_relevancy:
    lambda: 0.6
    top_terms: 2000
  interdisciplinarity:
    entropy_weighting: true
    author_publication_weighting: true
    publication_count_weighting: true
    top_topics_threshold: 5
    scoring_method: entropy     # 'entropy', 'gini', 'simpson'
    aggregation_method: mean    # 'mean', 'max', 'weighted'

# Text Processing Configuration
text_processing:
  vocabulary_filtering:
    low_thresh: 1               # Minimum document frequency
    high_frac: 0.995            # Maximum document frequency fraction
  lda_relevancy:
    train_lda: true
    num_topics: 50              # Topics in the global LDA relevancy model
    lda_passes: 1

# Visualization Output Configuration
output:
  figure_size: [12, 14]
  elevation: 25
  azimuth: 60
  show_colorbar: true
  show_histogram: true
